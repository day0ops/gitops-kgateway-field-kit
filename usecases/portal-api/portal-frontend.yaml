apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-frontend
  namespace: portal-api
  labels:
    app: portal-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-frontend
  template:
    metadata:
      labels:
        app: portal-frontend
    spec:
      containers:
        - name: portal-frontend
          image: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/skygate-portal:v0.1.5
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: VITE_PORTAL_SERVER_URL
              value: /v1
            - name: VITE_CLIENT_ID
              value: skygate-portal
            - name: VITE_AUTH_ENDPOINT
              value: https://keycloak.kgw.lab.day0ops.com/realms/kgateway-portal/protocol/openid-connect/auth
            - name: VITE_TOKEN_ENDPOINT
              value: https://keycloak.kgw.lab.day0ops.com/realms/kgateway-portal/protocol/openid-connect/token
            - name: VITE_LOGOUT_ENDPOINT
              value: https://keycloak.kgw.lab.day0ops.com/realms/kgateway-portal/protocol/openid-connect/logout
            - name: VITE_COMPANY_NAME
              value: Skygate
            - name: VITE_DEFAULT_APP_AUTH
              value: OAUTH,API_KEY,API_KEY_CLIENT_ID
---
apiVersion: v1
kind: Service
metadata:
  name: portal-frontend
  namespace: portal-api
  labels:
    app: portal-frontend
spec:
  selector:
    app: portal-frontend
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal-frontend
  namespace: portal-api
spec:
  parentRefs:
    - name: skygate-gateway
      namespace: kgateway-system
  hostnames:
    - skygate-api-portal.kgw.lab.day0ops.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: portal-frontend
          port: 4000
