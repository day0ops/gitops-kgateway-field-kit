apiVersion: v1
kind: ConfigMap
metadata:
  name: skygate-proto-descriptor
  namespace: portal-api
binaryData:
  descriptor: 
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: routing-transcoding
  namespace: portal-api
spec:
  parentRefs:
    - name: skygate-gateway
      namespace: kgateway-system
  hostnames:
    - skygate.kgw.lab.day0ops.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/lookup
      backendRefs:
        - name: skygate
          port: 9090
---
apiVersion: enterprisekgateway.solo.io/v1alpha1
kind: EnterpriseKgatewayTrafficPolicy
metadata:
  name: routing-transcoding-policy
  namespace: portal-api
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: routing-transcoding
  entGrpcJsonTranscoder:
    protoDescriptorConfigMap:
      name: skygate-proto-descriptor
      key: descriptor
    services:
      - skygate.lookup.v1.FlightLookupService
    autoMapping: true
    convertGrpcStatus: true
---
apiVersion: enterprisekgateway.solo.io/v1alpha1
kind: EnterpriseKgatewayTrafficPolicy
metadata:
  name: routing-transcoding-cors
  namespace: portal-api
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: routing-transcoding
  cors:
    allowOrigins:
      - https://skygate-api-portal.kgw.lab.day0ops.com
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowHeaders:
      - content-type
      - authorization
      - api-key
    maxAge: 86400
