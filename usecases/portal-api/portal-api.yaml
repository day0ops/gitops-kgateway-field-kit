apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal-api-public
  namespace: portal-api
spec:
  parentRefs:
    - name: skygate-gateway
      namespace: kgateway-system
  hostnames:
    - skygate.kgw.lab.day0ops.com
  rules:
    - backendRefs:
        - name: skygate
          port: 8080
---
apiVersion: portal.solo.io/v1alpha1
kind: ApiProduct
metadata:
  name: portal-api-product
  namespace: portal-api
spec:
  id: skygate-flights
  displayName: Skygate Flight Operations API
  versions:
    - name: v1
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: portal-api-public
