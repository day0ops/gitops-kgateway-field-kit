apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: skygate-canary
  namespace: kgateway-system
  labels:
    app: skygate-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skygate-canary
  template:
    metadata:
      labels:
        app: skygate-canary
    spec:
      containers:
        - name: skygate
          image: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/skygate:v0.3.0
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: PORT
              value: '8080'
            - name: GRPC_PORT
              value: '9090'
            - name: VERSION
              value: v1
            - name: COLOR
              value: green
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
  strategy:
    canary:
      stableService: skygate-canary-stable
      canaryService: skygate-canary-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: routing-basic
            namespace: kgateway-system
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 50
        - pause: {}
