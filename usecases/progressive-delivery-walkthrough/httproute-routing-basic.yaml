apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: routing-basic
  namespace: kgateway-system
spec:
  parentRefs:
    - name: skygate-walkthrough-gateway
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - demo.kgw.lab.day0ops.com
  rules:
    - backendRefs:
        - name: skygate-canary-stable
          port: 8080
          weight: 100
        - name: skygate-canary-canary
          port: 8080
          weight: 0
